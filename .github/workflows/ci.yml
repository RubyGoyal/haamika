name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Typecheck, Test with Coverage, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with Coverage
        run: npm run test:coverage
        env:
          SESSION_SECRET: ci-test-secret-that-is-at-least-32-bytes-long!
          CRON_SECRET: ci-cron-secret-value
          NODE_ENV: test

      - name: Build
        run: npm run build
