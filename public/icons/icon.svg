<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#1e3a8a"/>
  <!-- Pill icon with heart / care symbol -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Pill half top -->
    <path d="M -70 -140 A 70 70 0 0 1 70 -140 L 70 0 L -70 0 Z" fill="#3b82f6"/>
    <!-- Pill half bottom -->
    <path d="M -70 0 L 70 0 L 70 140 A 70 70 0 0 1 -70 140 Z" fill="#ffffff"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#1e3a8a" stroke-width="8"/>
  </g>
  <!-- Trust check / heart marker -->
  <circle cx="360" cy="150" r="50" fill="#22c55e"/>
  <path d="M 345 150 L 356 162 L 378 138" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
